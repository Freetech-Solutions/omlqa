; ------------------------------------------------------------
; Subrutinas de reproducción de mensajes y música
; ------------------------------------------------------------


; VOICEBOT CALLS
; mode_1: 100% music + SIP REFER
; mode_2: 100% music + OML API (80% GESTION_BOT / 20% MUDA_BOT)
; mode_3: 25% SIP REFER + GESTION_BOT / 25% MUDA_BOT / 25% ABANDON_BOT / 25% agenda+summary
; mode_4: 10% SIP REFER + GESTION_BOT / 25% MUDA_BOT / 40% ABANDON_BOT / 25% agenda+summary
;         (webhook de transferencia SOLO si hubo SIP REFER)
[voicebot_calls]
exten => s,1,NoOp(voicebot_calls ${ENV(VOICEBOT_CALL_MODE)})
same => n,Set(oml_telnum=${CALLERID(NUM)})
same => n,Set(oml_campid=${PJSIP_HEADER(read,X-OML-Voicebot-CampID)})
same => n,ExecIf($["${oml_campid}" = ""]?Set(oml_campid=${PJSIP_HEADER(read,X-OML-CampID)}))
same => n,ExecIf($["${oml_campid}" = ""]?Set(oml_campid=${PJSIP_HEADER(read,X-Verloop-CampID)}))
same => n,Set(oml_contactid=${PJSIP_HEADER(read,X-OML-Voicebot-CustomerID)})
same => n,ExecIf($["${oml_contactid}" = ""]?Set(oml_contactid=${PJSIP_HEADER(read,X-OML-CustomerID)}))
same => n,ExecIf($["${oml_contactid}" = ""]?Set(oml_contactid=${PJSIP_HEADER(read,X-Verloop-CustomerID)}))
same => n,Set(oml_uniqueid=${PJSIP_HEADER(read,X-OML-Voicebot-CallID)})
same => n,ExecIf($["${oml_uniqueid}" = ""]?Set(oml_uniqueid=${PJSIP_HEADER(read,X-OML-CallID)}))
same => n,ExecIf($["${oml_uniqueid}" = ""]?Set(oml_uniqueid=${PJSIP_HEADER(read,X-Verloop-CallID)}))
same => n,Verbose(2, voicebot camp=${oml_campid} contact=${oml_contactid} call=${oml_uniqueid})
same => n,Wait(2)
same => n,GotoIf($["${ENV(VOICEBOT_CALL_MODE)}" == "mode_1"]?voicebot_mode_1)
same => n,GotoIf($["${ENV(VOICEBOT_CALL_MODE)}" == "mode_2"]?voicebot_mode_2)
same => n,GotoIf($["${ENV(VOICEBOT_CALL_MODE)}" == "mode_3"]?voicebot_mode_3)
same => n,GotoIf($["${ENV(VOICEBOT_CALL_MODE)}" == "mode_4"]?voicebot_mode_4)
same => n,Goto(voicebot_mode_1)

same => n(voicebot_mode_1),NoOp(mode_1: 100% SIP REFER)
same => n,Goto(do_sip_refer)

same => n(voicebot_mode_2),NoOp(mode_2: 100% OML API 80/20)
same => n,Goto(do_gestion_bot)

same => n(voicebot_mode_3),NoOp(mode_3: 25% SIP REFER + GESTION_BOT / 25% MUDA_BOT / 25% ABANDON_BOT / 25% agenda+summary)
same => n,Set(VB_CASE=${RAND(1,4)})
same => n,Verbose(2, voicebot mode_3 case ${VB_CASE})
same => n,GotoIf($[${VB_CASE} = 1]?do_sip_refer)
same => n,GotoIf($[${VB_CASE} = 2]?do_muda_bot)
same => n,GotoIf($[${VB_CASE} = 3]?do_agenda)
same => n,Goto(do_abandon_bot)

same => n(voicebot_mode_4),NoOp(mode_4: 10% SIP REFER + GESTION_BOT / 25% MUDA_BOT / 40% ABANDON_BOT / 25% agenda+summary)
same => n,Set(VB_CASE=${RAND(1,20)})
same => n,Verbose(2, voicebot mode_4 case ${VB_CASE})
; 1-2 = 10% SIP REFER; 3-7 = 25% MUDA; 8-15 = 40% ABANDON; 16-20 = 25% agenda
same => n,GotoIf($[${VB_CASE} <= 2]?do_sip_refer)
same => n,GotoIf($[${VB_CASE} <= 7]?do_muda_bot)
same => n,GotoIf($[${VB_CASE} <= 15]?do_abandon_bot)
same => n,Goto(do_agenda)

same => n(do_sip_refer),NoOp(voicebot SIP REFER)
same => n,Answer()
same => n,Playback(oml_moh_02_27_sec)
same => n,Set(outcome=True)
; Hangup handler (GESTION_BOT → voicebot_transfer_proceed) SOLO tras intentar SIP REFER
same => n,Set(CHANNEL(hangup_handler_push)=rip-transfer-sip-refer,s,1)
same => n,Transfer(PJSIP/sip:12345@acd-server:5060)
same => n,Verbose(2, SIP REFER TRANSFERSTATUS=${TRANSFERSTATUS})
same => n,ExecIf($["${TRANSFERSTATUS}" != "SUCCESS"]?Set(CHANNEL(hangup_handler_wipe)=))
same => n,Hangup()

same => n(do_gestion_bot),NoOp(voicebot 80% GESTION_BOT / 20% MUDA_BOT)
same => n,Set(BOT_DISP=${RAND(1,5)})
same => n,GotoIf($[${BOT_DISP} = 5]?do_muda_bot)
same => n,Set(outcome=True)
same => n,Set(CHANNEL(hangup_handler_push)=rip-transfer-sip-refer,s,1)
same => n,Answer()
same => n,Playback(oml_moh_02_15_sec)
same => n,Hangup()

same => n(do_muda_bot),NoOp(voicebot MUDA_BOT)
same => n,Answer()
same => n,Playback(oml_moh_02_15_sec)
same => n,Verbose(2, voicebot MUDA_BOT camp=${oml_campid} contact=${oml_contactid} call=${oml_uniqueid})
same => n,AGI(webhook_verloop_client.py,${oml_contactid},${oml_campid},MUDA_BOT,${oml_uniqueid})
same => n,Hangup()

same => n(do_abandon_bot),NoOp(voicebot ABANDON_BOT)
same => n,Answer()
same => n,Playback(oml_moh_02_15_sec)
same => n,Verbose(2, voicebot ABANDON_BOT camp=${oml_campid} contact=${oml_contactid} call=${oml_uniqueid})
same => n,AGI(webhook_verloop_client.py,${oml_contactid},${oml_campid},ABANDON_BOT,${oml_uniqueid})
same => n,Hangup()

same => n(do_softphone),NoOp(voicebot dial softphone)
same => n,Answer()
same => n,Playback(oml_moh_02_15_sec)
same => n,Dial(IAX2/1006,15)
same => n,Hangup()

same => n(do_agenda),NoOp(voicebot agenda + summary webhooks)
same => n,Answer()
same => n,Playback(oml_moh_02_15_sec)
same => n,Verbose(2, voicebot agenda camp=${oml_campid} contact=${oml_contactid} call=${oml_uniqueid} phone=${oml_telnum})
; Paso 1: crear calificación Agenda + AgendaContacto (args 5/6 vacíos = mañana 15:00)
same => n,AGI(agenda.py,${oml_contactid},${oml_campid},${oml_uniqueid},${oml_telnum},,,PSTN emulator voicebot agenda,explicit_time)
; Paso 2: anexar call_summary a la agenda previa (sin transfer ACD)
same => n,AGI(webhook_verloop_client.py,${oml_contactid},${oml_campid},agenda,${oml_uniqueid})
same => n,Hangup()

[transfer_oml_api]
exten => s,1,NoOp(voicebot_50_50)
same => n,Set(CALL_COUNT=${DB(dialplan/call_count_voicebot)})
same => n,GotoIf($["${CALL_COUNT}" = ""]?init_counter:check_counter)
; Inicializar el contador si no existe
same => n(init_counter),NoOp(Initializing voicebot call counter)
same => n,Set(DB(dialplan/call_count_voicebot)=1)
same => n,Set(CALL_COUNT=${DB(dialplan/call_count_voicebot)})
same => n,Goto(check_counter)
; Evaluar el caso basado en el contador
same => n(check_counter),NoOp(Check voicebot mode based on counter)
same => n,Set(CALL_TYPE=$[${CALL_COUNT} % 2])
same => n,GotoIf($[${CALL_TYPE} = 0]?call_voicebot_short_call:call_voicebot_long_call)
; Caso 1: Short Call (50%)
same => n(call_voicebot_short_call),NoOp(Case: Short Call)
same => n,Set(DB(dialplan/call_count_voicebot)=$[${CALL_COUNT} + 1])
same => n,Wait(2)
same => n,Answer()
same => n,Playback(alicia_virtual)
same => n,AGI(webhook_verloop_transfer.py,${oml_contactid},${oml_campid},32)
same => n,Hangup()
; Caso 2: Long Call (50%)
same => n(call_voicebot_long_call),NoOp(Case: Long Call)
same => n,Set(DB(dialplan/call_count_voicebot)=$[${CALL_COUNT} + 1])
same => n,Wait(2)
same => n,Answer()
same => n,Playback(oml_moh_02_15_sec)
same => n,AGI(webhook_verloop_transfer.py,${oml_contactid},${oml_campid},32)
same => n,Hangup()

