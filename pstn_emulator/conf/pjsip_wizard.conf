; Trunk ACD via kamailio-pstn. Voicebot INVITEs use From=<tel_contacto>@kamailio-pstn
; (not 01177660010), so matching must be by source IP/hostname, not From-user.
; accepts_registrations MUST be no: the PJSIP wizard skips/deletes identify objects
; when accepts_registrations=yes, even if identify/match is set.
; identify/match must be IP/CIDR only, never a hostname: at Asterisk load the
; container DNS may not resolve it yet (containers start in parallel) and one
; failed match rejects the WHOLE identify object — every call then fails with
; "No matching endpoint found". The entrypoint adds identify/match=${SUBNET}
; at start when SUBNET is set.
[01177660010](omnileads)
inbound_auth/username=01177660010
accepts_auth=no
accepts_registrations=no
endpoint/identify_by=ip,username
remote_hosts=kamailio-pstn

[01177660020](omnileads)
inbound_auth/username=01177660020

[01177660030](omnileads)
inbound_auth/username=01177660030

[01177660040](omnileads)
inbound_auth/username=01177660040

